services:
  rabbitmq:
    image: 'rabbitmq:3-management-alpine'
    container_name: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
  postgres:
    image: 'postgres:15-alpine'
    container_name: mcprata_db
    environment:
      - 'POSTGRES_DB=mcprata'
      - 'POSTGRES_USER=zambrin'
      - 'POSTGRES_PASSWORD=zambrin'
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U zambrin -d mcprata" ]
      interval: 3s
      timeout: 3s
      retries: 5
  
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: mcprata_app
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRINGDOC.API-DOCS.PATH=/API-DOCS
      - SPRING_DOCKER_COMPOSE_ENABLED=false
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mcprata
      - SPRING_DATASOURCE_USERNAME=zambrin
      - SPRING_DATASOURCE_PASSWORD=zambrin
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - RABBITMQ_HOST=rabbitmq
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
volumes:
  pgdata: