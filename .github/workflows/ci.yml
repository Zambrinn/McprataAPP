name: CI - MCPrata

on:
  push:
    branches-ignore: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Package with Maven
        run: mvn -B clean package -DskipTests

      - name: Check Podman Version
        run: podman --version

      - name: Build Container Image with Podman
        run: |
          podman build \
            -t mcprata-app:latest \
            -f Dockerfile .

      - name: List Podman Images
        run: podman images

      - name: Create Pull Request to Main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base main --json number --jq '.[0].number')
          
          if [ -z "$EXISTING_PR" ]; then
            echo "Nenhum PR encontrado. Criando novo Pull Request"
            gh pr create \
              --title "Auto PR: merge $BRANCH_NAME into main" \
              --body "Pull Request criado automaticamente pela pipeline de CI após compilação e build da imagem Podman com sucesso!" \
              --base main \
              --head "$BRANCH_NAME"
          else
            echo "Já existe um Pull Request aberto para esta branch: PR #$EXISTING_PR"
          fi