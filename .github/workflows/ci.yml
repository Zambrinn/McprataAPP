name: CI - MCPrata
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Package with Maven
        run: mvn -B clean package -DskipTests

      - name: Check Podman Version
        run: podman --version

      - name: Build Container Image with Podman
        run: |
          podman build \
            -t mcprata-app:latest \
            -f Dockerfile .

      - name: List Podman Images
        run: podman images